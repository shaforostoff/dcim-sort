plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.shaforostoff.dcimsort'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    // The CMake build is wired in for every variant; the CMakeLists.txt returns early (builds
    // nothing) unless it is passed -DEDITION=full, so the lite APK stays native-free while the
    // full APK gets libdcimsort_codecs.so. This is robust regardless of how the build is invoked
    // (Studio, ./gradlew assembleFull*, bundleFull*, etc.).
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.shaforostoff.dcimsort"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    flavorDimensions "edition"
    productFlavors {
        // Pure-Java edition: no native libraries, smallest APK. AVIF only on Android 16+ (platform).
        // CMake is invoked but EDITION=lite makes it a no-op, so no .so is produced.
        lite {
            dimension "edition"
            versionNameSuffix "-lite"
            externalNativeBuild {
                cmake {
                    arguments "-DEDITION=lite"
                }
            }
        }
        // Adds C++ codecs (libavif + aom, jpegli): AVIF on every Android version with HDR + EXIF,
        // and a jpegli-backed JPEG mode. Same applicationId as lite (alternative distribution).
        full {
            dimension "edition"
            versionNameSuffix "-full"
            ndk {
                // Real codecs are built for arm64-v8a; armeabi-v7a gets a stub .so (see CMakeLists.txt)
                // so 32-bit devices can install and gracefully fall back to the pure-Java paths.
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
            // Keep rules for the JNI methods + reflected GainmapMeta fields (release/minify).
            proguardFiles 'src/full/proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DEDITION=full"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.exifinterface
    implementation libs.androidx.heifwriter
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
